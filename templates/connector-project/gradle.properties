org.gradle.jvmargs=-Xmx2g

# Read by the Gradle daemon only. The wrapper launcher does not read this file —
# see ./gw. A JVM setting needed to DOWNLOAD the distribution belongs in GRADLE_OPTS
# there; one needed to RESOLVE dependencies belongs here.

# Pin the JDK rather than relying on macOS discovery: a Homebrew openjdk is
# keg-only and /usr/libexec/java_home does not look in the Cellar, so an
# installed-but-unlinked JDK is invisible and the failure names a missing plugin.
# org.gradle.java.home=/opt/homebrew/opt/openjdk@<version>/libexec/openjdk.jdk/Contents/Home

# Trust store for dependency resolution, when TLS is intercepted. Pair with the
# same setting in GRADLE_OPTS in ./gw, or the distribution download still fails.
# org.gradle.jvmargs=-Xmx2g -Djavax.net.ssl.trustStore=/absolute/path/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
